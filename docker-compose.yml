services:
  stellartransfer:
    build:
      context: .
      dockerfile: Dockerfile
    image: stellartransfer:latest
    container_name: stellartransfer
    restart: unless-stopped
    ports:
      - "${STELLARTRANSFER_PORT:-3000}:3000"
    environment:
      NODE_ENV: docker
      DATA_DIRECTORY: /opt/app/backend/data
      DATABASE_URL: "file:/opt/app/backend/data/stellartransfer.db?connection_limit=1"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      CADDY_DISABLED: "${CADDY_DISABLED:-false}"
      BACKEND_PORT: "8080"
      PORT: "3333"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    volumes:
      - stellartransfer-data:/opt/app/backend/data
      - stellartransfer-images:/opt/app/frontend/public/img
      # Optional file-based configuration:
      # - ./config.yaml:/opt/app/config.yaml:ro

volumes:
  stellartransfer-data:
  stellartransfer-images:
