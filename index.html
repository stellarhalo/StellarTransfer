<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CowTransfer Mock</title>
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: #f3f3f3;
  color: #555;
}

.browser-bar {
  height: 42px;
  background: #fff;
  border-bottom: 5px solid #333;
  display: flex;
  align-items: center;
  padding: 0 20px;
  font-size: 22px;
  color: #555;
}

.url {
  flex: 1;
}

.star {
  font-size: 28px;
}

.page {
  min-height: calc(100vh - 42px);
  position: relative;
  background: linear-gradient(90deg, #f7f7f7 0%, #fff 48%, #eee 100%);
  padding-top: 105px;
}

.banner {
  position: absolute;
  top: 0;
  left: 30%;
  width: 55%;
  height: 105px;
  background: #ffd95b;
  border-radius: 0 0 38px 38px;
  display: flex;
  align-items: center;
  gap: 28px;
  padding: 0 42px;
  color: #4a4a4a;
}

.cow-icon {
  font-size: 42px;
}

.banner-text {
  font-size: 21px;
  line-height: 1.35;
}

.banner-text b {
  color: #333;
}

.app-store {
  margin-left: auto;
  background: #000;
  color: #fff;
  border-radius: 8px;
  padding: 9px 22px;
  font-size: 20px;
  font-weight: 600;
}

.close {
  font-size: 42px;
  margin-left: 20px;
}

.card {
  width: 490px;
  height: 775px;
  background: #fff;
  margin-left: 56px;
  box-shadow: 0 3px 22px rgba(0,0,0,.14);
  position: relative;
}

.file-row {
  height: 86px;
  display: flex;
  align-items: center;
  padding: 0 32px;
  border-bottom: 1px solid #eee;
  font-size: 22px;
}

.file-name {
  color: #333;
}

.file-size {
  margin-left: auto;
  color: #8d8d8d;
}

.icon {
  font-size: 30px;
  margin-left: 22px;
  color: #444;
}

.blank {
  height: 250px;
  border-bottom: 1px solid #eee;
}

.info {
  text-align: center;
  padding-top: 70px;
  font-size: 22px;
  line-height: 1.8;
}

.info b {
  color: #333;
}

.expire {
  color: #999;
}

.download-btn {
  margin: 36px auto 18px;
  width: 385px;
  height: 64px;
  border: none;
  border-radius: 34px;
  background: #ffd84d;
  color: #5a4b16;
  font-size: 23px;
  cursor: pointer;
}

.transfer {
  display: inline-block;
  color: #888;
  border-bottom: 2px solid #555;
  font-size: 19px;
  padding-bottom: 3px;
}

.divider {
  width: 385px;
  height: 1px;
  background: #eee;
  margin: 30px auto;
}

.share {
  font-size: 19px;
  color: #888;
}

.share span {
  font-size: 28px;
  color: #333;
  margin-right: 20px;
}

.watermark {
  position: fixed;
  right: 24px;
  bottom: 18px;
  color: #b5b5b5;
  font-size: 18px;
}
</style>
</head>

<!--<body>-->
<!--  <div class="browser-bar">-->
<!--    <div class="url">ⓘ cowtransfer.com/s/413aa2e6b7f849</div>-->
<!--    <div class="star">☆</div>-->
<!--  </div>-->

  <main class="page">


    <section class="card">
      <div class="file-row">
        <span class="file-name">ps.exe</span>
        <span class="file-size">- 847.32 KB</span>
        <span class="icon">☁</span>
        <span class="icon">↓</span>
      </div>

      <div class="blank"></div>

      <div class="info">
        <div>1个文件</div>
        <div>总大小: <b>847.32 KB</b></div>
        <div class="expire">下载链接将于 <b>168</b> 小时后过期</div>

        <button class="download-btn">下载文件 ↓</button>

        <div>
          <span class="transfer">立即转存随时下载</span>
        </div>

        <div class="divider"></div>

        <div class="share">
          <span>...</span> 通过手机分享
        </div>
      </div>
    </section>

    <div class="watermark">@稀土掘金技术社区</div>
  </main>
</body>
</html>
